<!doctype html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleSynthSeq</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
  <h1>SimpleSynthSeq</h1>
  <button id="playBtn" class="primary">▶ Afspil</button>
  <label class="bpm-field">BPM
    <input id="bpmInput" type="number" min="40" max="300" value="120">
  </label>
  <label class="bpm-field">Længde
    <select id="lengthSelect">
      <option value="16">16</option>
      <option value="32">32</option>
      <option value="64">64</option>
    </select>
  </label>
  <button id="clearBtn">Ryd mønster</button>
  <button id="resetBtn">Nulstil alt</button>
  <span class="spacer"></span>
  <span id="statusText" class="status"></span>
</header>

<main>
  <div class="seq-wrapper" id="seqWrapper">
    <div class="ruler-row">
      <div class="row-header-spacer"></div>
      <div class="steps-ruler" id="stepsRuler"></div>
    </div>
    <div id="tracksContainer"></div>
  </div>
</main>

<footer class="hint">
  Klik på et sporsnavn for at redigere FM-synth-parametre. Skrue-parametre pr. knap (fx tone-override) kommer senere.
</footer>

<script src="app.js"></script>
</body>
</html>
