<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleSynthSeq</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
  <h1>SimpleSynthSeq</h1>
  <button id="playBtn" class="primary">▶ Play</button>
  <label class="bpm-field">BPM
    <input id="bpmInput" type="number" min="40" max="300" value="78">
  </label>
  <label class="bpm-field">Length
    <select id="lengthSelect"></select>
  </label>
  <label class="bpm-field">Swing
    <input id="swingInput" type="number" min="0" max="75" step="5" value="0">%
  </label>
  <button id="addTrackBtn">＋ Add track</button>
  <button id="importMidiBtn">📥 Import MIDI</button>
  <input type="file" id="midiFileInput" accept=".mid,.midi" style="display:none">
  <button id="clearBtn">Clear pattern</button>
  <button id="resetBtn">Reset all</button>
  <span class="spacer"></span>
  <span id="statusText" class="status"></span>
</header>

<main>
  <div class="seq-wrapper" id="seqWrapper">
    <div class="ruler-row">
      <div class="row-header-spacer"></div>
      <div class="steps-ruler" id="stepsRuler"></div>
    </div>
    <div id="tracksContainer"></div>
  </div>
</main>

<footer class="hint">
  Click a track name to edit FM synth parameters, including chord mode, delay and reverb. Right-click a lit step to edit its note, chord and groove timing. Import MIDI with the toolbar button (try example.mid).
</footer>

<script src="app.js"></script>
</body>
</html>
